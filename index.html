<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>The Frontier Remains Open</title>
    <meta
      name="description"
      content="AI is the inevitable frontier. Two paths lead away from it — one closed, one open."
    />
    <!--
      Critical first paint (build.md B6). Everything else is generated in TS, so without
      this the page is blank until the bundle executes. The Act I sky and the horizon are
      inlined, and the h1 is real text, which makes it the LCP element — an inline <svg>
      never is.
    -->
    <style>
      html,
      body {
        margin: 0;
        background: #1b2a4a;
      }
      .noscript-doc {
        max-width: 62ch;
        margin: 0 auto;
        padding: 8vh 6vw;
        color: #f5f0e8;
        font-family: 'Inter Tight', 'Inter', -apple-system, system-ui, sans-serif;
        line-height: 1.6;
      }
      .noscript-doc a {
        color: #ffb59c;
      }
      #stage-critical {
        position: fixed;
        inset: 0;
        z-index: -1;
        background: linear-gradient(
          to bottom,
          #1b2a4a 0%,
          #4a5b8c 20%,
          #c97b5a 40%,
          #f2a65a 52%,
          #ffd9a0 58%,
          #c89a6b 58.01%,
          #c89a6b 100%
        );
      }
    </style>
  </head>
  <body>
    <div id="stage-critical" aria-hidden="true"></div>

    <div id="scroll">
      <div id="stage">
        <!-- Depth slots are appended here by src/stage.ts. -->
        <div id="anchor-horizon" aria-hidden="true"></div>
        <div id="anchor-vp" aria-hidden="true"></div>

        <div id="copy"></div>
      </div>
    </div>

    <noscript>
      <!--
        The whole argument, verbatim, with no JavaScript. Same principle as the
        reduced-motion path: this is a first-class route to the content, not a stub.
        Copy is duplicated from src/copy.ts — if the deck changes, change it here too.
      -->
      <div class="noscript-doc">
        <h1>AI is the inevitable frontier.</h1>
        <p>
          Abundance is guaranteed. Competition is not. Emerging technologies could make
          intelligence, knowledge, medicine, energy, and productive capacity reach new
          levels of development and sophistication.
        </p>
        <p>We see two paths ahead for AI development.</p>

        <p><strong>One</strong></p>
        <h2>Closed Frontier</h2>
        <p>
          If technological power becomes concentrated within a small number of corporations
          and government institutions, progress could instead produce dependency, regulatory
          capture, and permanent barriers to competition.
        </p>

        <p><strong>Two</strong></p>
        <h2>Open Frontier</h2>
        <p>
          A society in which technological progress remains open to new entrants,
          independent researchers, and widespread experimentation; genuine risks are
          governed without creating monopolies; and the state is limited in scope, capable
          in execution, and constrained by individual rights.
        </p>

        <h2>Our goal is to ensure the frontier remains open.</h2>
        <p>
          <a href="#TODO-get-involved">Get involved</a>
          &middot;
          <a href="#TODO-full-case">Read the full case &rarr;</a>
        </p>

          TODO: organisation name &middot; TODO: contact &middot; TODO: socials &middot;
          TODO: legal
        </p>
      </div>
    </noscript>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
